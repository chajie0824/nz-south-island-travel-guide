<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新西兰南岛11天自驾攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nz-style.css?v=21">
</head>
<body class="theme-guide public-export">
<div class="wrap">
  <nav class="sitenav standalone-nav"><span>New Zealand South Island Road Trip · 新西兰南岛自驾攻略</span></nav>

  <header class="masthead guide-hero">
    <h1>新西兰南岛11天自驾攻略</h1>
    <div class="trip-stats">
      <div class="stat-chip"><span class="k">行程</span><span class="v">11天10晚</span></div>
      <div class="stat-chip"><span class="k">路线</span><span class="v">中线 + 东线</span></div>
      <div class="stat-chip"><span class="k">实拍</span><span class="v" id="photo-count">54 张</span></div>
      <div class="stat-chip"><span class="k">起终点</span><span class="v">基督城</span></div>
    </div>
  </header>

  <section class="route-overview" aria-labelledby="route-overview-title">
    <div class="section-head"><h2 id="route-overview-title">我们实际走过的南岛路线</h2><span class="hint">标注主要城镇与纯驾驶时间</span></div>
    <figure class="route-map-card">
      <a href="assets/南岛中东线路线图.svg" target="_blank" rel="noopener" title="打开大图">
        <img src="assets/南岛中东线路线图.svg?v=3" alt="新西兰南岛中线与东线11天自驾路线图">
      </a>
      <figcaption>点击可打开大图。</figcaption>
    </figure>
  </section>

  <section>
    <div class="section-head"><h2>逐日实走攻略</h2><span class="hint">11天行程、实拍与 Google 地图</span></div>
    <div id="guide-days" class="guide-days"></div>
  </section>

  <section class="food-guide" aria-labelledby="food-guide-title">
    <div class="section-head"><h2 id="food-guide-title">皇后镇美食推荐</h2><span class="hint">推荐和实拍放在一起</span></div>
    <div id="food-guide-cards" class="food-guide-cards"></div>
  </section>

</div>

<script src="照片/照片配置.js"></script>
<script src="照片/照片清单.js"></script>
<script src="assets/guide-data.js"></script>
<script>
const escapeHTML = value => String(value).replace(/[&<>"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
const albums = window.GUIDE_PHOTO_ALBUMS || {};
const friendCredit = window.GUIDE_PHOTO_CONFIG?.friendCredit || "方块";
const defaultCredit = window.GUIDE_PHOTO_CONFIG?.defaultCredit || "茶";
const container = document.querySelector("#guide-days");
const photoTotal = Object.values(albums).reduce((sum, files) => sum + files.length, 0);
document.querySelector("#photo-count").textContent = photoTotal + " 张";

const isFriendPhoto = file => /f\.[^.]+$/i.test(file);
const cleanFilename = file => file.replace(/\.[^.]+$/, "").replace(/f$/i, "").replace(/([a-zA-Z])([一-龥])/g, "$1 · $2");
const encodedPath = relative => relative.split("/").map(encodeURIComponent).join("/");

function renderMedia(albumKey, files, fallbackLabel, largeFiles, photoWidths) {
  return files.map((file, index) => {
    const relative = `照片/${albumKey}/${file}`;
    const caption = /^(IMG|DSC)_?\d+/i.test(file) ? fallbackLabel : cleanFilename(file);
    const credit = isFriendPhoto(file) ? `摄影：${friendCredit}` : `图源：${defaultCredit}`;
    const isLarge = largeFiles && largeFiles.includes(file);
    const widthPct = photoWidths && photoWidths[file];
    const widthStyle = widthPct ? ` style="width:${widthPct}%"` : "";
    return `<figure class="guide-photo-item${isLarge ? " is-large" : ""}">
      <a href="${encodedPath(relative)}" target="_blank" rel="noopener">
        <img src="${encodedPath(relative)}" alt="${escapeHTML(caption)}" loading="lazy"${widthStyle}>
      </a>
      <figcaption><span>${escapeHTML(caption)}</span><span class="photo-credit">${escapeHTML(credit)}</span></figcaption>
    </figure>`;
  }).join("");
}

function renderStopMedia(stop) {
  const keys = stop.albums || (stop.album ? [stop.album] : []);
  const media = keys.map(key => {
    const available = albums[key] || [];
    const selected = stop.files ? stop.files.filter(file => available.includes(file)) : available;
    return renderMedia(key, selected, stop.title, stop.largeFiles, stop.photoWidths);
  }).join("");
  return media ? `<div class="stop-gallery${stop.featured ? " is-featured" : ""}">${media}</div>` : "";
}

function renderLegMap(fromLabel, fromQuery, toLabel, toQuery, drive) {
  const sameLocation = fromQuery.trim().toLowerCase() === toQuery.trim().toLowerCase();
  if (sameLocation) {
    return `<div class="segment-map-card">
      <div class="no-photo-note same-location-note"><span>SAME LOCATION</span><p>${escapeHTML(toLabel)}与${escapeHTML(fromLabel)}是同一地点，无需额外驾车。</p></div>
      <div class="segment-map-meta">
        <div><b>${escapeHTML(fromLabel)} → ${escapeHTML(toLabel)}</b>${drive ? `<span>${escapeHTML(drive)}</span>` : ""}</div>
      </div>
    </div>`;
  }
  const embed = `https://maps.google.com/maps?saddr=${encodeURIComponent(fromQuery)}&daddr=${encodeURIComponent(toQuery)}&output=embed`;
  const directions = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(fromQuery)}&destination=${encodeURIComponent(toQuery)}&travelmode=driving`;
  return `<div class="segment-map-card">
    <iframe src="${embed}" loading="lazy" allowfullscreen title="${escapeHTML(fromLabel)} 到 ${escapeHTML(toLabel)}的地图"></iframe>
    <div class="segment-map-meta">
      <div><b>${escapeHTML(fromLabel)} → ${escapeHTML(toLabel)}</b>${drive ? `<span>${escapeHTML(drive)}</span>` : ""}</div>
      <a href="${directions}" target="_blank" rel="noopener">Google 地图 ↗</a>
    </div>
  </div>`;
}

function renderJourney(day) {
  let fromLabel = day.origin;
  let fromQuery = day.originQuery;
  const stops = day.stops.map((stop, index) => {
    const media = renderStopMedia(stop) || `<div class="no-photo-note"><span>${escapeHTML(stop.placeholderTag || "NO PHOTO")}</span><p>${escapeHTML(stop.placeholder || "这一站暂时没有实拍照片。")}</p></div>`;
    const segment = `<section class="journey-stop">
      <div class="journey-stop-head">
        <span class="journey-index">${String(index + 1).padStart(2, "0")}</span>
        <div><h3>${escapeHTML(stop.title)}</h3>${stop.note ? `<p>${escapeHTML(stop.note)}</p>` : ""}</div>
      </div>
      <div class="journey-segment">
        ${renderLegMap(fromLabel, fromQuery, stop.title, stop.to, stop.drive)}
        <div class="journey-visual">${media}</div>
      </div>
    </section>`;
    fromLabel = stop.title;
    fromQuery = stop.to;
    return segment;
  }).join("");
  const stay = day.stay ? `<section class="journey-stop is-stay">
    <div class="journey-stop-head">
      <span class="journey-index">住</span>
      <div><h3>当天住宿区域</h3><p>${escapeHTML(day.stay.area)}</p></div>
    </div>
    <div class="journey-segment">
      ${renderLegMap(fromLabel, fromQuery, "住宿区域", day.stay.query, day.stay.drive)}
      <div class="lodging-card"><span>ACCOMMODATION AREA</span><strong>${escapeHTML(day.stay.area)}</strong></div>
    </div>
  </section>` : "";
  return `<div class="journey-flow">
    <div class="journey-origin"><span>我们的出发点</span><strong>${escapeHTML(day.origin)}</strong></div>
    ${stops}${stay}
  </div>`;
}

for (const day of guideDays) {
  const article = document.createElement("article");
  article.className = "guide-day";
  article.id = `day${day.day}`;
  article.innerHTML = `
    <div class="guide-day-head">
      <div><span class="guide-day-number">DAY ${day.day}</span><h2>${day.date} · ${escapeHTML(day.title)}</h2></div>
      <a class="gmap-link" href="${day.route}" target="_blank" rel="noopener">🗺 打开当天 Google 地图</a>
    </div>
    <p class="guide-summary">${escapeHTML(day.summary)}</p>
    <div class="guide-story">${day.story.map(paragraph => `<p>${escapeHTML(paragraph)}</p>`).join("")}</div>
    ${day.callout ? `<div class="experience-callout">${escapeHTML(day.callout)}</div>` : ""}
    ${renderJourney(day)}`;
  container.appendChild(article);
}


document.querySelector("#food-guide-cards").innerHTML = foodCards.map(item => `<article class="food-story-card${item.top ? " is-top" : ""}">
  <div class="food-story-copy"><span>${escapeHTML(item.tag)}</span><h3>${escapeHTML(item.title)}</h3><p>${escapeHTML(item.text)}</p></div>
  <div class="stop-gallery food-gallery">${renderMedia(foodAlbum, item.files.filter(file => (albums[foodAlbum] || []).includes(file)), item.title)}</div>
</article>`).join("");
</script>
</body>
</html>
