const escapeHTML = value => String(value).replace(/[&<>"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
const albums = window.GUIDE_PHOTO_ALBUMS || {};
const friendCredit = window.GUIDE_PHOTO_CONFIG?.friendCredit || "方块";
const defaultCredit = window.GUIDE_PHOTO_CONFIG?.defaultCredit || "茶";
const container = document.querySelector("#guide-days");
const photoTotal = Object.values(albums).reduce((sum, files) => sum + files.length, 0);
document.querySelector("#photo-count").textContent = photoTotal + " 张";

const isFriendPhoto = file => /f\.[^.]+$/i.test(file);
const cleanFilename = file => file.replace(/\.[^.]+$/, "").replace(/f$/i, "").replace(/([a-zA-Z])([一-龥])/g, "$1 · $2");
const encodedPath = relative => relative.split("/").map(encodeURIComponent).join("/");

function renderMedia(albumKey, files, fallbackLabel) {
  return files.map((file, index) => {
    const relative = `照片/${albumKey}/${file}`;
    const caption = /^(IMG|DSC)_?\d+/i.test(file) ? fallbackLabel : cleanFilename(file);
    const credit = isFriendPhoto(file) ? `摄影：${friendCredit}` : `图源：${defaultCredit}`;
    return `<figure class="guide-photo-item">
      <a href="${encodedPath(relative)}" target="_blank" rel="noopener">
        <img src="${encodedPath(relative)}" alt="${escapeHTML(caption)}" loading="lazy">
      </a>
      <figcaption><span>${escapeHTML(caption)}</span><span class="photo-credit">${escapeHTML(credit)}</span></figcaption>
    </figure>`;
  }).join("");
}

function renderStopMedia(stop) {
  const keys = stop.albums || (stop.album ? [stop.album] : []);
  const media = keys.map(key => {
    const available = albums[key] || [];
    const selected = stop.files ? stop.files.filter(file => available.includes(file)) : available;
    return renderMedia(key, selected, stop.title);
  }).join("");
  return media ? `<div class="stop-gallery">${media}</div>` : "";
}

function renderLegMap(fromLabel, fromQuery, toLabel, toQuery, drive) {
  const embed = `https://maps.google.com/maps?saddr=${encodeURIComponent(fromQuery)}&daddr=${encodeURIComponent(toQuery)}&output=embed`;
  const directions = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(fromQuery)}&destination=${encodeURIComponent(toQuery)}&travelmode=driving`;
  return `<div class="segment-map-card">
    <iframe src="${embed}" loading="lazy" allowfullscreen title="${escapeHTML(fromLabel)} 到 ${escapeHTML(toLabel)}的地图"></iframe>
    <div class="segment-map-meta">
      <div><b>${escapeHTML(fromLabel)} → ${escapeHTML(toLabel)}</b>${drive ? `<span>${escapeHTML(drive)}</span>` : ""}</div>
      <a href="${directions}" target="_blank" rel="noopener">Google 地图 ↗</a>
    </div>
  </div>`;
}

function renderJourney(day) {
  let fromLabel = day.origin;
  let fromQuery = day.originQuery;
  const stops = day.stops.map((stop, index) => {
    const media = renderStopMedia(stop);
    const segment = `<section class="journey-stop">
      <div class="journey-stop-head">
        <span class="journey-index">${String(index + 1).padStart(2, "0")}</span>
        <div><h3>${escapeHTML(stop.title)}</h3>${stop.note ? `<p>${escapeHTML(stop.note)}</p>` : ""}</div>
      </div>
      <div class="journey-segment${media ? "" : " no-media"}">
        ${renderLegMap(fromLabel, fromQuery, stop.title, stop.to, stop.drive)}
        ${media ? `<div class="journey-visual">${media}</div>` : ""}
      </div>
    </section>`;
    fromLabel = stop.title;
    fromQuery = stop.to;
    return segment;
  }).join("");
  const stay = day.stay ? `<section class="journey-stop is-stay">
    <div class="journey-stop-head">
      <span class="journey-index">住</span>
      <div><h3>当天住宿区域</h3><p>${escapeHTML(day.stay.area)}</p></div>
    </div>
    <div class="journey-segment">
      ${renderLegMap(fromLabel, fromQuery, "住宿区域", day.stay.query, day.stay.drive)}
      <div class="lodging-card"><span>ACCOMMODATION AREA</span><strong>${escapeHTML(day.stay.area)}</strong></div>
    </div>
  </section>` : "";
  return `<div class="journey-flow">
    <div class="journey-origin"><span>我们的出发点</span><strong>${escapeHTML(day.origin)}</strong></div>
    ${stops}${stay}
  </div>`;
}

  container.appendChild(article);
}
